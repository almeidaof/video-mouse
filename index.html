
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        video {
            width: 90%;
            max-width: 900px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <video controls autoplay playsinline>
        <source src="video.mp4" type="video/mp4">
        Seu navegador não suporta vídeo.
    </video>

</body>
</html>
